[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.3",
  "setuptools-scm>=8",
]

[project]
name = "django-hosts"
description = "Dynamic and static host resolving for Django. Maps hostnames to URLconfs."
readme = "README.rst"
license = "BSD-3-Clause"
authors = [
  { name = "Jannis Leidel", email = "jannis@leidel.info" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dynamic = [ "version" ]
urls.Homepage = "https://django-hosts.readthedocs.io/"
urls.Source = "https://github.com/jazzband/django-hosts"

[tool.setuptools.packages.find]
include = [ "django_hosts*" ]

[tool.setuptools_scm]
